    <script>
      // Photos sit BESIDE the text, not stacked through it: the first one pairs
      // with the standfirst at the top, the rest pair with the longest sections
      // and alternate sides down the page. Figures are collected as they arrive
      // and laid out once, by tghArticleEnd(), when the body is complete.
      var TGH_FIGS = [];

      function tghFigure(mount, url, caption) {
        if (!url) return;
        TGH_FIGS.push({ url: url, caption: caption || '' });
      }

      function tghBuildFigure(f) {
        var fig = document.createElement('figure');
        fig.className = 'tgh-figure';
        var i = document.createElement('img');
        i.src = f.url; i.alt = f.caption; i.loading = 'lazy'; i.decoding = 'async';
        fig.appendChild(i);
        if (f.caption) {
          var c = document.createElement('figcaption');
          c.textContent = f.caption;      // caption always below the image
          fig.appendChild(c);
        }
        return fig;
      }

      function tghSplitRow(cls) {
        var row = document.createElement('div');
        row.className = 'tgh-split' + (cls ? ' ' + cls : '');
        var t = document.createElement('div'); t.className = 'tgh-split-text';
        var m = document.createElement('div'); m.className = 'tgh-split-media';
        row.appendChild(t); row.appendChild(m);
        row._text = t; row._media = m;
        return row;
      }

      function tghLayoutFigures() {
        var body  = document.getElementById('blog-description');
        var intro = document.getElementById('blog-introduction');
        if (!body || !TGH_FIGS.length) return;
        var figs = TGH_FIGS.slice();
        TGH_FIGS.length = 0;

        // 1) the standfirst and the opening photo, side by side
        if (intro && intro.parentNode && figs.length) {
          var lede = tghSplitRow('tgh-split--lede');
          intro.parentNode.insertBefore(lede, intro);
          lede._text.appendChild(intro);
          lede._media.appendChild(tghBuildFigure(figs.shift()));
        }

        // 2) the rest pair with the meatiest sections, so a photo never sits
        //    next to two lines of text. Sides alternate down the article.
        var sections = [].slice.call(body.querySelectorAll('h2')).map(function (h) {
          var nodes = [h], n = h.nextElementSibling, len = h.textContent.length;
          while (n && n.tagName !== 'H2') { nodes.push(n); len += n.textContent.length; n = n.nextElementSibling; }
          return { h: h, nodes: nodes, len: len };
        }).sort(function (a, b) { return b.len - a.len; });

        figs.forEach(function (f, k) {
          var sec = sections[k];
          if (!sec) { body.appendChild(tghBuildFigure(f)); return; }
          var row = tghSplitRow('');
          sec.h.parentNode.insertBefore(row, sec.h);
          sec.nodes.forEach(function (n) { row._text.appendChild(n); });
          row._media.appendChild(tghBuildFigure(f));
        });

        // Sides alternate by position on the PAGE, not by pairing order — the
        // sections were picked by length, so their document order differs.
        [].slice.call(document.querySelectorAll('.tgh-split')).forEach(function (r, idx) {
          if (idx % 2) r.classList.add('tgh-split--rev');
        });
      }

      function tghArticleEnd() {
        var body = document.getElementById('blog-description');
        if (!body || document.querySelector('.tgh-article-end')) return;
        tghLayoutFigures();
        var d = document.createElement('div');
        d.className = 'tgh-article-end';
        d.innerHTML = '<a href="events.html" class="ae-primary">More trips &amp; tours</a>' +
                      '<a href="reservation.html" class="ae-ghost">Book your stay</a>';
        body.parentNode.appendChild(d);
      }
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function(){

        const urlParams = new URLSearchParams(window.location.search);
        const myParam = urlParams.get('id');
        
         const apiUrl = '/api/blogs/'+myParam+'?populate=*';

         fetch(apiUrl, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(response => { if (!response.ok) throw new Error('HTTP ' + response.status); return response.json(); })

      .then(data => {
          if (!data || !data.data) throw new Error('empty');

          const blogtitle = document.getElementById('blogtitle');
          blogtitle.textContent = data.data.attributes.title;

          const paratitle = document.getElementById('paratitle');
          paratitle.textContent = data.data.attributes.title;


          const timestamp = new Date(data.data.attributes.publishedAt);
          const month = timestamp.toLocaleString('default', { month: 'long' });
          const day = timestamp.getDate();
          const year = timestamp.getFullYear();
          
          const blogdate = document.getElementById('blogdate');
          blogdate.textContent = `${month} ${day}, ${year}`;
          console.log(data);

          const converter = new showdown.Converter();
          
          const blogintroduction = document.getElementById('blog-introduction');
          const htmlintrdouction = converter.makeHtml(data.data.attributes.introduction);

          blogintroduction.innerHTML = htmlintrdouction;

          const blogbody = document.getElementById('blog-description');
          const htmlbody = converter.makeHtml(data.data.attributes.description);

          blogbody.innerHTML = htmlbody;

          const blogimage = document.getElementById('blog-image');
          const images = (data.data.attributes.images && data.data.attributes.images.data) || [];
          if (images.length) {
            images.forEach(image => {
              tghFigure(blogimage, image.attributes.url, image.attributes.caption || '');
            });
          } else {
            // The blogs table has no media rows, so /api/blogs returns an empty
            // images array. Use the captioned figures bundled with the article
            // rather than dropping the photos when the API is live.
            const bundled = (window.TGH_BLOGS || []).filter(p => String(p.id) === String(myParam))[0];
            (bundled && bundled.images || []).forEach(im => {
              tghFigure(blogimage, im.url, im.caption || '');
            });
          }
          tghArticleEnd();

          const header = document.getElementById('header');
          const imageUrl = ''+data.data.attributes.header_img.data.attributes.url;
          header.style.backgroundImage = `url('${imageUrl}')`;

         })
         // The article lives in the database; if the API can't be reached the
         // page would otherwise render completely blank. Say so, and offer a
         // way back, instead of showing nothing.
         // API unreachable (or running without a backend): fall back to the
         // article bundled in js/blog-data.js so the page is never blank.
         .catch(function (e) {
           console.warn('[TGH] blog from API unavailable (' + e.message + ') — using bundled copy.');
           var post = (window.TGH_BLOGS || []).filter(function (p) { return String(p.id) === String(myParam); })[0];
           if (!post) {
             document.getElementById('blogtitle').textContent = 'Story not found';
             document.getElementById('paratitle').textContent = 'We couldn’t find that story';
             document.getElementById('blog-introduction').innerHTML =
               '<p class="mt-4"><a href="events.html" class="btn btn-primary text-white">All trips &amp; tours</a></p>';
             return;
           }
           var conv = new showdown.Converter();
           document.getElementById('blogtitle').textContent = post.title;
           document.getElementById('paratitle').textContent = post.title;
           var d = new Date(post.date + 'T00:00:00');
           document.getElementById('blogdate').textContent =
             d.toLocaleString('default', { month: 'long' }) + ' ' + d.getDate() + ', ' + d.getFullYear();
           document.getElementById('blog-introduction').innerHTML = conv.makeHtml(post.introduction);
           document.getElementById('blog-description').innerHTML = conv.makeHtml(post.description);
           document.getElementById('header').style.backgroundImage = "url('" + post.header_img + "')";
           var fig = document.getElementById('blog-image');
           (post.images || []).forEach(function (im) { tghFigure(fig, im.url, im.caption); });
           tghArticleEnd();
         });
      });
    </script>
