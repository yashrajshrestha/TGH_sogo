    <script src="js/main.js?v=2"></script>
    <script src="js/tgh-api.js?v=20260820g"></script>

    <script>

      $(document).ready(function(){

        function populateFormFields(){

          const urlParams = new URLSearchParams(window.location.search);
          const start_date = urlParams.get("start_date");
          const end_date = urlParams.get("end_date");
          const adultInput = urlParams.get("adult");
          const childrenInput = urlParams.get("children");

          $("#checkin_date").datepicker("setDate", start_date);
          $("#checkout_date").datepicker("setDate", end_date);

          document.getElementById("adults").value = adultInput;
          document.getElementById("children").value= childrenInput;
        }

        populateFormFields();
      });

      document.getElementById('submitButton').addEventListener('click', function(){
        submitForm();
      });

      function submitForm() {

        const form = document.getElementById('reservation');
        const formData = new FormData(form);

        const formDataObject = {};
        formData.forEach((value, key) => {
          if (['check_in', 'check_out'].includes(key)) formDataObject[key] = convertDate(value);
          else if (['adult', 'children'].includes(key)) formDataObject[key] = Number(value) || 0;
          else formDataObject[key] = value; // phone is a biginteger — a string is fine
        });

        // Public "create" on /api/bookings is enabled in Strapi, so no API token
        // is needed. (A stale bearer token would 401 rather than fall back to the
        // public role — which is exactly what the old hardcoded token did.)
        fetch('/api/bookings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: formDataObject })
        })
        .then(async (response) => {
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error((payload.error && payload.error.message) || ('HTTP ' + response.status));
          }
          return payload;
        })
        .then(() => {
          alert('Booking has been created!');
          window.location.search = '';
          window.location.reload();
        })
        .catch((error) => {
          alert('Could not create booking: ' + error.message);
          console.error('API Error:', error);
        });
      }

      function convertDate(dateString) {
        
        const parts = dateString.split(" ");
        const day = parts[0];
        const month = parts[1].replace(',', '').trim();
        const year = parts[2];

        const monthMap = {
          January: "01",
          February: "02",
          March: "03",
          April: "04",
          May: "05",
          June: "06",
          July: "07",
          August: "08",
          September: "09",
          October: "10",
          November: "11",
          December: "12",
        };
        return `${year}-${monthMap[month]}-${day}`;
      }
    </script>
