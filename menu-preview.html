<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu preview — Thamel Grand Hotel</title>
  <style>
    body{margin:0;font-family:Georgia,serif;background:#14110d;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;}
    .eyebrow{color:#ffba5a;letter-spacing:4px;text-transform:uppercase;font-size:12px;margin-bottom:8px;font-family:Roboto,Arial,sans-serif;}
    h1{font-size:44px;margin:0 0 6px;}
    .sub{color:rgba(255,255,255,.6);margin:0 0 40px;font-size:15px;}
    .menu-tabs{list-style:none;padding:0;margin:0 0 46px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
    .menu-tab{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:9px 24px;border-radius:40px;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background .3s,color .3s,border-color .3s;font-family:Roboto,Arial,sans-serif;}
    .menu-tab:hover{border-color:#ffba5a;color:#ffba5a;}
    .menu-tab.active{background:#ffba5a;border-color:#ffba5a;color:#3a2c12;font-weight:600;}
    .menu-stage{position:relative;width:100%;max-width:460px;margin:0 auto;aspect-ratio:3/4;perspective:1900px;}
    .menu-panel{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s ease;}
    .menu-panel.is-active{opacity:1;pointer-events:auto;}
    .menu-fold{width:100%;height:100%;transform-origin:top center;transform:rotateX(-90deg);transition:transform .85s cubic-bezier(.2,.8,.25,1);border-radius:10px;overflow:hidden;box-shadow:0 28px 60px rgba(0,0,0,.55);background:#f6efe1;will-change:transform;}
    .menu-panel.is-active .menu-fold{transform:rotateX(0deg);}
    .menu-fold img{width:100%;height:100%;object-fit:contain;display:block;background:#f6efe1;}
    @supports not (aspect-ratio:1/1){.menu-stage{height:0;padding-bottom:133.33%;}}
    .hint{margin-top:30px;color:rgba(255,255,255,.5);font-family:Roboto,Arial,sans-serif;font-size:13px;}
  </style>
</head>
<body>
  <div class="eyebrow">Our Kitchen</div>
  <h1>Our Menu</h1>
  <p class="sub">Click a tab — the menu folds open.</p>

  <div class="food-menu-fold">
    <ul class="menu-tabs" role="tablist">
      <li><button type="button" class="menu-tab active" data-menu="breakfast">Breakfast</button></li>
      <li><button type="button" class="menu-tab" data-menu="mains">Mains</button></li>
      <li><button type="button" class="menu-tab" data-menu="vegetarian">Vegetarian</button></li>
      <li><button type="button" class="menu-tab" data-menu="drinks">Drinks</button></li>
    </ul>
    <div class="menu-stage">
      <div class="menu-panel is-active" data-menu="breakfast"><div class="menu-fold"><img src="images/menu-breakfast.svg" alt="Breakfast menu"></div></div>
      <div class="menu-panel" data-menu="mains"><div class="menu-fold"><img src="images/menu-mains.svg" alt="Mains menu"></div></div>
      <div class="menu-panel" data-menu="vegetarian"><div class="menu-fold"><img src="images/menu-vegetarian.svg" alt="Vegetarian menu"></div></div>
      <div class="menu-panel" data-menu="drinks"><div class="menu-fold"><img src="images/menu-drinks.svg" alt="Drinks menu"></div></div>
    </div>
  </div>
  <p class="hint">This is a standalone preview. The same menu lives in the homepage "Our Menu" section.</p>

  <script>
    (function () {
      var wrap = document.querySelector('.food-menu-fold');
      var tabs = wrap.querySelectorAll('.menu-tab');
      var panels = wrap.querySelectorAll('.menu-panel');
      function show(key) {
        tabs.forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-menu') === key); });
        panels.forEach(function (p) { p.classList.toggle('is-active', p.getAttribute('data-menu') === key); });
      }
      tabs.forEach(function (t) { t.addEventListener('click', function () { show(t.getAttribute('data-menu')); }); });
      panels.forEach(function (p) { p.classList.remove('is-active'); });
      setTimeout(function () { show('breakfast'); }, 120);
    })();
  </script>
</body>
</html>
